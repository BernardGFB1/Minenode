services:
  minenode:
    build: .
    image: minenode:latest
    container_name: minenode
    restart: unless-stopped
    ports:
      - "8080:8080"       # panel WWW (najlepiej za reverse proxy z HTTPS)
      - "25565:25565"     # Minecraft – WSZYSTKIE serwery przez wbudowane proxy (routing po subdomenie)
    volumes:
      - minenode-data:/data
    environment:
      TZ: Europe/Warsaw
      PUID: "1000"
      PGID: "1000"
      # Opcjonalnie – konto administratora tworzone przy pierwszym starcie (inaczej kreator w przeglądarce):
      # MINENODE_ADMIN_USER: admin
      # MINENODE_ADMIN_PASSWORD: zmien-mnie-na-dlugie-haslo
      # Klucz API CurseForge (można też ustawić w panelu):
      # CURSEFORGE_API_KEY: ""
      # Ustaw na "true", gdy panel jest serwowany przez HTTPS:
      MINENODE_SECURE_COOKIES: "false"
    # Serwery dostają czas na zapis świata przy zatrzymaniu kontenera
    stop_grace_period: 2m
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    # Limit pamięci kontenera – panel pokaże go przy suwakach RAM
    # deploy:
    #   resources:
    #     limits:
    #       memory: 16g

volumes:
  minenode-data:
